<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Assistant for Matter</title>
<style>
  /* Plugin page for matterbridge-hass: setup wizard (welcome, find Home Assistant, connect) and the device table.
     Served by Matterbridge at /plugins/matterbridge-hass/ and calling /plugins/matterbridge-hass/api/:path (platform.onFetch). */
  :root {
    --bg: #f2f5f9; --surface: #ffffff; --soft: #f6f8fb; --fg: #17212c; --muted: #5d6a78; --line: #dfe5ec;
    --accent: #2f63d8; --accent-soft: #e8eefc; --accent-fg: #ffffff;
    --ok: #18794e; --ok-soft: #e3f4ea; --wait: #a05a00; --wait-soft: #fff1dc; --bad: #b42318; --bad-soft: #fde9e7; --na: #9aa5b1;
    --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e131a; --surface: #161d26; --soft: #1b232e; --fg: #e6ebf1; --muted: #97a4b3; --line: #2a3441;
    --accent: #7199ff; --accent-soft: #1c2a47; --accent-fg: #0b1220; --ok: #55c58f; --ok-soft: #13301f;
    --wait: #f2a74e; --wait-soft: #2e2312; --bad: #ff8a7d; --bad-soft: #3a1a17; --na: #66727f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-size: 12.5px; }
  a { color: var(--accent); }

  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 110px; display: flex; flex-direction: column; gap: 18px; }

  .steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; justify-content: center; }
  .steps li button { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 10px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .steps li button:disabled { cursor: default; }
  .steps .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; border: 1.5px solid var(--line); }
  .steps .done .num { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .steps .cur button { color: var(--fg); background: var(--surface); }
  .steps .cur .num { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .steps .skipped .num { border-color: var(--wait); color: var(--wait); }

  .framed { min-height: calc(100vh - 32px); display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); }
  .wiz { background: var(--surface); border-radius: 18px; padding: 32px 28px; max-width: 640px; width: 100%; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; border: 1px solid var(--line); }
  .wiz .mono, .note .mono, .choice .d { overflow-wrap: anywhere; }
  @media (max-width: 520px) { .wiz { padding: 22px 16px; border-radius: 14px; } .wiz h1 { font-size: 23px; } .btn.big { padding: 11px 16px; } }
  .wiz h1 { margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; text-wrap: balance; }
  .wiz .lead { margin: 0; color: var(--muted); font-size: 16px; }
  .wiz-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .glyph { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .plan { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .plan li { display: flex; gap: 12px; align-items: flex-start; }
  .plan .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .plan b { display: block; }
  .plan span { color: var(--muted); font-size: 14px; }

  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .btn.big { padding: 12px 22px; font-size: 16px; }
  .btn.link { background: none; border: 0; color: var(--muted); padding: 9px 4px; font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .choice { display: flex; gap: 14px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice input[type="radio"] { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .choice .t { font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .choice .d { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .choice input[type="text"] { margin-top: 8px; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  .tag.saved { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
  .scan { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 18px 4px; }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

  .guide { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .guide li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; }
  .guide .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .guide p { margin: 2px 0 0; }
  .guide .sub { color: var(--muted); font-size: 14px; }
  .fakebtn { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); }
  .tokenbox { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tokenbox input { flex: 1 1 260px; min-width: 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-family: var(--font-mono); font-size: 13px; }
  .result { border-radius: 12px; padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .result small { display: block; font-weight: 500; }
  .result.ok { background: var(--ok-soft); color: var(--ok); }
  .result.bad { background: var(--bad-soft); color: var(--bad); }
  .result.wait { background: var(--soft); color: var(--muted); }
  .advice { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .advice ol { margin: 6px 0; padding-left: 20px; }
  .advice span { color: var(--muted); font-size: 13px; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }

  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .page-head h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .page-head .stat { color: var(--muted); font-size: 14px; }
  .page-head .stat b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }

  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } .side:not(.open) { display: none; } }
  @media (min-width: 821px) { #filtersBtn { display: none; } }

  .side { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  .side-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .side details { border-bottom: 1px solid var(--line); }
  .side summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .side summary::-webkit-details-marker { display: none; }
  .side summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
  .side details[open] summary::before { transform: rotate(45deg); }
  .side summary .badge { margin-left: auto; background: var(--accent); color: var(--accent-fg); border-radius: 999px; font-size: 11px; padding: 0 7px; }
  .opts { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 2px 0; }
  .opt input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
  .opt .c { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .rules { padding: 12px 14px 14px; background: var(--soft); display: flex; flex-direction: column; gap: 12px; }
  .rules h3 { margin: 0; font-size: 14px; }
  .rule label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .dchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 12px; padding: 2px 4px 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
  .dchip button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
  .rule select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); font-size: 13px; }

  .main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tools input[type="search"] { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .quick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .expert { font-size: 13.5px; background: var(--wait-soft); color: var(--wait); border-radius: 10px; padding: 9px 12px; }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tr { display: grid; grid-template-columns: 36px minmax(180px, 1.3fr) 150px minmax(200px, 2fr); gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
  .tr.th { border-top: 0; background: var(--soft); font-size: 13px; color: var(--muted); font-weight: 600; padding-block: 10px; }
  .tr input.sel { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
  .tr input.sel:disabled { opacity: .45; cursor: not-allowed; }
  .tr.na { color: var(--na); }
  .tr.pending { background: var(--wait-soft); }
  .tr input.sel { cursor: pointer; }
  .nm { min-width: 0; display: flex; gap: 10px; align-items: center; }
  .ico { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .tr.na .ico { background: var(--soft); color: var(--na); }
  .nm .t { font-weight: 600; overflow-wrap: anywhere; }
  .nm .m { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .tr.na .nm .m { color: var(--na); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.synced { background: var(--ok-soft); color: var(--ok); }
  .pill.notsynced { background: var(--accent-soft); color: var(--accent); }
  .pill.pending { background: var(--wait-soft); color: var(--wait); }
  .pill.na { background: var(--soft); color: var(--na); }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .cap { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 9px 3px 6px; border-radius: 7px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; max-width: 100%; }
  .cap input { width: 15px; height: 15px; margin: 0; accent-color: var(--ok); flex: none; }
  .cap.off { color: var(--muted); font-weight: 500; text-decoration: line-through; }
  .cap.dis { cursor: default; color: var(--na); font-weight: 500; font-style: italic; }
  .more { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 3px 4px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) {
    .tr.th { display: none; }
    .tr { grid-template-columns: 28px minmax(0, 1fr); grid-template-areas: "sel nm" ". st" ". caps"; row-gap: 8px; }
    .tr > :nth-child(1) { grid-area: sel; } .tr > :nth-child(2) { grid-area: nm; } .tr > :nth-child(3) { grid-area: st; }
    .tr > :nth-child(4) { grid-area: caps; }
  }

  .locked { background: var(--surface); border-radius: 14px; border: 1px dashed var(--line); padding: 36px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .locked h2 { margin: 0; font-size: 20px; }
  .locked p { margin: 0; color: var(--muted); max-width: 52ch; }

  .banner { border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 600; background: var(--wait-soft); color: var(--wait); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .savebar .in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
  .savebar .state { color: var(--muted); font-size: 14px; }
  .savebar .state b { color: var(--wait); }
  .savebar .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .modal-back { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); }
  .modal h2 { margin: 0; font-size: 20px; color: var(--bad); }
  .modal p { margin: 0; }
  .modal .big-n { font-size: 34px; font-weight: 800; color: var(--bad); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); z-index: 11; }
</style>
</head>
<body>
<div class="wrap">
  <ol class="steps" id="steps" hidden></ol>
  <div id="view"><div class="scan"><span class="spin"></span>Loading…</div></div>
</div>

<div class="savebar" id="savebar" hidden>
  <div class="in">
    <div class="state" id="saveState"></div>
    <div class="actions">
      <button class="btn link" id="discard">Discard</button>
      <button class="btn primary" id="save">Save</button>
    </div>
  </div>
</div>
<div class="modal-back" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';

// ---------- Theme: follow the Matterbridge frontend (it injects its background color into this page) ----------
function applyTheme() {
  const color = getComputedStyle(document.body).backgroundColor;
  const m = color.match(/\d+(\.\d+)?/g);
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (document.getElementById('matterbridge-plugin-scrollbar-style') && m && m.length >= 3) dark = (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) < 128;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
applyTheme();
new MutationObserver(applyTheme).observe(document.head, { childList: true });

// ---------- API: /plugins/matterbridge-hass/api/:path (relative to this page) ----------
async function api(path, body) {
  const options = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  let response;
  try {
    response = await fetch('api/' + path, options);
  } catch {
    throw Object.assign(new Error('Matterbridge is not answering.'), { kind: 'offline' });
  }
  // 502/504 come from a proxy while Matterbridge is down, 503 while the plugin is still starting.
  if ([502, 503, 504].includes(response.status)) throw Object.assign(new Error('Matterbridge or the plugin is starting.'), { kind: 'offline' });
  if (!response.ok) throw new Error(`The plugin answered ${response.status}.`);
  return response.json();
}

// ---------- State ----------
const S = {
  mode: 'loading', // loading | framed | wizard | devices | error
  step: 1, maxStep: 1, skipped: false,
  servers: null, server: '', manual: '',
  token: '', tokenState: 'idle', tokenMessage: '',
  status: null, items: [], saved: '', domains: [], onlyDomains: [], neverDomains: [], filterByArea: '', filterByLabel: '',
  loadError: '', search: '', filters: { status: new Set(), area: new Set(), label: new Set(), integration: new Set(), kind: new Set() },
  expanded: new Set(), showFilters: false, savedNotice: false, saving: false,
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
const svg = (p, size = 28) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const domainOf = (e) => e.split('.')[0];
const ICONS = {
  light: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/>',
  switch: '<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="3"/>',
  sensor: '<path d="M12 3v11"/><circle cx="12" cy="17" r="4"/>',
  binary_sensor: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  climate: '<path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1L19.1 4.9"/>',
  cover: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 8h16M4 13h16"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  vacuum: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
  valve: '<path d="M4 14h16M8 14V9h8v5M12 9V5M9 5h6"/>',
  fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7s2 5-2 7M14 12c4 0 7 1 7 4s-5 2-7-2M12 14c0 4-1 7-4 7s-2-5 2-7M10 12c-4 0-7-1-7-4s5-2 7 2"/>',
  media_player: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',
  scene: '<path d="M4 6h16v12H4zM4 10h16"/>',
  script: '<path d="M8 5l-5 7 5 7M16 5l5 7-5 7"/>',
  automation: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
};
const iconFor = (item) => {
  const cap = item.capabilities.find((c) => c.matter) ?? item.capabilities[0];
  const d = cap ? domainOf(cap.entityId) : 'sensor';
  return svg(ICONS[d] ?? ICONS[{ input_boolean: 'switch', input_button: 'switch', button: 'switch', remote: 'switch', select: 'script', input_select: 'script', event: 'binary_sensor' }[d]] ?? ICONS.sensor, 18);
};

// ---------- Selection model ----------
const domainAllowed = (d) => !S.neverDomains.includes(d) && (!S.onlyDomains.length || S.onlyDomains.includes(d));
const usable = (it) => it.capabilities.filter((c) => c.matter && domainAllowed(domainOf(c.entityId)));
// A device the analysis finds not useful in Matter (only maintenance buttons, only battery...) is shown as Not supported, unless it is already synced.
const supported = (it) => usable(it).length > 0 && (!it.notUseful || it.syncedAtLoad);
const hasMatter = (it) => it.capabilities.some((c) => c.matter);
function startFresh() {
  // Starting fresh nothing counts as synced: devices not useful in Matter turn Not supported.
  S.items.forEach((it) => { it.selected = false; it.syncedAtLoad = false; selectMainFunctions(it); });
  S.onlyDomains = []; S.neverDomains = []; S.reset = true; S.savedNotice = false;
  toast('Everything is unticked. Tick the devices you want, then Save.');
  render();
}
function snap() { return JSON.stringify({ i: S.items.map((it) => [it.selected, it.capabilities.map((c) => c.selected)]), o: S.onlyDomains, n: S.neverDomains }); }
const savedOf = (index) => JSON.parse(S.saved).i[index];
function status(it, index = S.items.indexOf(it)) {
  if (!supported(it)) return 'na';
  const [was, wasCaps] = savedOf(index);
  if (it.selected && !was) return 'adding';
  if (!it.selected && was) return 'removing';
  if (it.selected) return JSON.stringify(it.capabilities.map((c) => c.selected)) !== JSON.stringify(wasCaps) ? 'changed' : 'synced';
  return 'notsynced';
}
const STATUS = { synced: ['synced', 'Synced'], adding: ['pending', 'Syncs on save'], removing: ['pending', 'Removed on save'], changed: ['pending', 'Updates on save'], notsynced: ['notsynced', 'Not synced'], na: ['na', 'Not supported'] };
const GROUP = { synced: 'Synced', changed: 'Synced', notsynced: 'Not synced', adding: 'Waiting to save', removing: 'Waiting to save', na: 'Not supported' };
function dirtyCount() {
  if (!S.saved) return 0;
  const now = JSON.parse(snap()), was = JSON.parse(S.saved);
  let n = now.i.filter((x, i) => JSON.stringify(x) !== JSON.stringify(was.i[i])).length;
  if (JSON.stringify([now.o, now.n]) !== JSON.stringify([was.o, was.n])) n++;
  if (S.reset && n === 0) n = 1;
  return n;
}

// ---------- Loading ----------
// Matterbridge opens plugin pages in its own window (an iframe). Offer the page in a browser tab instead.
const isFramed = (() => { try { return window.self !== window.top; } catch { return true; } })();
const pageUrl = location.href.split('#')[0];
// Through Home Assistant (ingress) the address only works with the Home Assistant login of this window: a new tab gets 401.
const isIngress = location.pathname.includes('/api/hassio_ingress/');
// Offer a separate tab only where it works and helps: framed by Matterbridge, not through Home Assistant, on a large screen.
// The address for a separate tab. Through Home Assistant it is the direct Matterbridge address, when it answers.
let tabUrl = isIngress ? '' : pageUrl;
const offerNewTab = () => isFramed && tabUrl !== '' && window.innerWidth >= 700;

// Through Home Assistant on a computer: check if Matterbridge also answers on its own address (port 8283 on the same host),
// which works in any tab without the Home Assistant login. An https page can't check an http address, so it stays in the window.
async function findDirectUrl() {
  if (!isIngress || !isFramed || window.innerWidth < 700 || location.protocol === 'https:') return;
  const url = `http://${location.hostname}:8283/plugins/matterbridge-hass/`;
  try {
    await fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(2500) });
    tabUrl = url;
  } catch {
    // Not reachable: the page stays in the window.
  }
}

async function start() {
  await findDirectUrl();
  if (offerNewTab() && !S.stayInWindow) { S.mode = 'framed'; render(); return; }
  try {
    S.status = await api('status');
  } catch (error) {
    if (error.kind === 'offline') { waitForMatterbridge(false); return; }
    S.mode = 'error'; S.loadError = error.message; render(); return;
  }
  if (!S.status.configured) { S.mode = 'wizard'; S.step = 1; render(); return; }
  S.mode = 'devices'; S.tokenState = 'ok';
  const problem = await loadItems(false);
  if (problem && problem.kind === 'offline') return;
  if (problem && (problem.kind === 'rejected' || problem.kind === 'unreachable')) {
    // The saved connection doesn't work: start the wizard from the welcome page and explain why.
    Object.assign(S, { mode: 'wizard', step: 1, maxStep: 1, problem, tokenState: 'idle', servers: null, server: problem.kind === 'rejected' ? S.status.host : '' });
    render();
  }
}

async function loadItems(refresh) {
  S.loadError = ''; S.items = []; S.saved = ''; render();
  try {
    const data = await api('items' + (refresh ? '?refresh=1' : ''));
    if (!data.ok) {
      const error = new Error(data.error === 'rejected' ? 'Home Assistant rejected the saved key.' : data.error === 'unreachable' ? `Can’t reach Home Assistant: ${data.message ?? ''}` : 'Home Assistant is not connected yet.');
      error.kind = data.error;
      throw error;
    }
    S.items = data.items; S.domains = data.domains; S.onlyDomains = data.onlyDomains; S.neverDomains = data.neverDomains;
    S.filterByArea = data.filterByArea; S.filterByLabel = data.filterByLabel;
    S.items.forEach((it) => { if (!hasMatter(it)) it.selected = false; it.syncedAtLoad = it.selected; });
    S.saved = snap();
  } catch (error) {
    if (error.kind === 'offline') { waitForMatterbridge(false); return { kind: 'offline', message: error.message }; }
    S.loadError = error.message;
    render();
    return { kind: error.kind ?? 'error', message: error.message };
  }
  render();
  return null;
}

// ---------- Restart and waiting for Matterbridge ----------
async function restartMatterbridge() {
  S.savedNotice = false;
  let ok = false;
  try {
    ok = (await api('restart', {})).ok;
  } catch (error) {
    ok = error.kind === 'offline'; // Matterbridge went down before answering: the restart started.
  }
  if (!ok) { toast('Matterbridge didn’t accept the restart. Use the Restart button of Matterbridge.'); S.savedNotice = true; render(); return; }
  waitForMatterbridge(true);
}

// Show a waiting screen and poll until Matterbridge and the plugin answer again, then reload the page state.
async function waitForMatterbridge(restarting) {
  if (S.waiting) return;
  S.waiting = true; S.mode = 'waiting'; S.waitRestarting = restarting; render();
  const started = Date.now();
  let wentDown = !restarting;
  for (;;) {
    await new Promise((r) => setTimeout(r, 2000));
    try {
      await api('status');
      // After a restart request wait until Matterbridge was seen down, or 20 s passed, before trusting the answer.
      if (wentDown || Date.now() - started > 20000) break;
    } catch {
      wentDown = true;
    }
  }
  S.waiting = false;
  S.backOnline = restarting;
  S.mode = 'loading';
  start();
}

function waiting() {
  return `<div class="framed"><div class="wiz" style="text-align:center;align-items:center">
    <div class="spin" style="width:40px;height:40px;border-width:4px"></div>
    <h1>${S.waitRestarting ? 'Matterbridge is restarting' : 'Waiting for Matterbridge'}</h1>
    <p class="lead">${S.waitRestarting ? 'Please wait. This page comes back by itself when Matterbridge is ready.' : 'Matterbridge isn’t answering right now. It may be restarting. This page keeps trying and comes back by itself.'}</p>
  </div></div>`;
}

// ---------- Render ----------
const STEPS = ['Welcome', 'Find Home Assistant', 'Connect', 'Choose devices'];
function render() {
  const steps = $('#steps');
  steps.hidden = S.mode !== 'wizard';
  if (S.mode === 'wizard') {
    steps.innerHTML = STEPS.map((t, i) => {
      const n = i + 1;
      const cls = n === S.step ? 'cur' : n === 3 && S.skipped ? 'skipped' : n <= S.maxStep ? 'done' : '';
      const mark = cls === 'done' ? '✓' : cls === 'skipped' ? '!' : n;
      return `<li class="${cls}"><button data-go="${n}" ${n > S.maxStep ? 'disabled' : ''}><span class="num">${mark}</span>${t}</button></li>`;
    }).join('');
  }
  const v = $('#view');
  if (S.mode === 'framed') v.innerHTML = framed();
  else if (S.mode === 'waiting') v.innerHTML = waiting();
  else if (S.mode === 'error') v.innerHTML = `<div class="locked"><h2>The plugin page can't load</h2><p>${esc(S.loadError)}</p><button class="btn primary" data-act="reload">Try again</button></div>`;
  else if (S.mode === 'wizard' && S.step === 1) v.innerHTML = welcome();
  else if (S.mode === 'wizard' && S.step === 2) v.innerHTML = find();
  else if (S.mode === 'wizard' && S.step === 3) v.innerHTML = connect();
  else if (S.mode !== 'loading') v.innerHTML = devices();
  renderSaveBar();
}

// Recommended: Home Assistant on the Matterbridge computer, else the saved one, else the first found.
function recommendedIndex() {
  const local = S.servers.findIndex((sv) => sv.local);
  if (local !== -1) return local;
  const saved = S.servers.findIndex((sv) => sv.saved);
  return saved !== -1 ? saved : 0;
}

const chosenUrl = () => (S.server === 'manual' ? S.manual.trim() : S.server);

// The address for this browser: Home Assistant on the Matterbridge computer (localhost, 127.x, add-on name) is reached
// at the address the browser uses for Matterbridge. Other addresses are already IPs from the search.
function browserUrl(url) {
  try {
    const u = new URL(/^[a-z]+:\/\//i.test(url) ? url : 'http://' + url);
    if (u.hostname === 'localhost' || u.hostname.startsWith('127.') || u.hostname === 'homeassistant') u.hostname = location.hostname;
    return u.toString().replace(/\/+$/, '');
  } catch {
    return url;
  }
}

async function discover() {
  if (discover.running) return;
  discover.running = true;
  try {
    S.servers = (await api('discover')).servers;
  } catch {
    S.servers = [];
  }
  discover.running = false;
  // Fixing a rejected key: keep the saved Home Assistant selected. Otherwise preselect the recommended one.
  const saved = S.servers.find((sv) => sv.saved);
  if (S.problem?.kind === 'rejected' && saved) S.server = saved.url;
  if (S.server && S.server !== 'manual' && !S.servers.some((sv) => sv.url === S.server)) { S.manual = S.server; S.server = 'manual'; }
  if (!S.server) S.server = S.servers[recommendedIndex()]?.url ?? 'manual';
  render();
}

function connect() {
  const url = browserUrl(chosenUrl().replace(/\/+$/, ''));
  const res = {
    idle: '',
    checking: `<div class="result wait"><span class="spin"></span><div>Checking the key with Home Assistant…</div></div>`,
    ok: `<div class="result ok">✓<div>All good. Connected to ${esc(S.tokenMessage || 'Home Assistant')}.<small>The key is saved. Press Next to choose your devices.</small></div></div>

    rejected: `<div class="result bad">✕<div>Home Assistant didn’t accept this key.<small>Make sure you copied the whole key (it is very long), then paste it again. Home Assistant shows a key only once, so create a new one if you lost it.</small></div></div>`,
    unreachable: `<div class="result bad">✕<div>We couldn’t reach Home Assistant at ${esc(url)}.<small>${esc(S.tokenMessage)} Go back and check the address.</small></div></div>`,
    invalid: `<div class="result bad">✕<div>Paste the key first.</div></div>`,
  }[S.tokenState];
  return `<div class="wiz">
    <h1>Connect to Home Assistant</h1>

      <li><span class="n">3</span><div><p>Name it <b>Matterbridge</b>, press <span class="fakebtn">OK</span>, then press the copy button next to the key.</p><p class="sub">Home Assistant shows the key only once.</p></div></li>
      <li><span class="n">4</span><div><p>Come back to this tab and paste the key here:</p>
        <div class="tokenbox"><input id="token" placeholder="Paste the key here" value="${esc(S.token)}" autocomplete="off" spellcheck="false" aria-label="Access token">
        <button class="btn primary" data-act="check" ${S.tokenState === 'checking' ? 'disabled' : ''}>Check</button></div></div></li>
    </ol>
    ${res}
    <div class="wiz-foot">
      <button class="btn link" data-act="back">Back</button>
      <span>${S.tokenState === 'ok' ? '' : `<button class="btn link" data-act="skip">Skip for now</button>`}
        <button class="btn primary big" data-act="next" ${S.tokenState === 'ok' ? '' : 'disabled'}>Next</button></span>
    </div>
    ${S.tokenState === 'ok' ? '' : `<p class="note">If you skip, we can’t list your devices until the key is added.</p>`}
  </div>`;
}

async function checkToken() {
  S.token = ($('#token')?.value ?? S.token).trim();
  if (!S.token) { S.tokenState = 'invalid'; render(); return; }
  S.tokenState = 'checking'; render();
  try {
    const r = await api('token', { url: chosenUrl(), token: S.token });
    S.tokenState = r.ok ? 'ok' : (r.error === 'rejected' ? 'rejected' : r.error === 'invalid' ? 'invalid' : 'unreachable');
    S.tokenMessage = r.ok ? (r.locationName ? `${r.locationName} (Home Assistant ${r.version})` : `Home Assistant ${r.version}`) : (r.message ?? '');
    if (r.ok) { S.skipped = false; S.problem = null; if (S.status) { S.status.host = chosenUrl().replace(/\/+$/, ''); S.status.configured = true; } }
  } catch (error) {
    S.tokenState = 'unreachable'; S.tokenMessage = error.message;
  }
  render();
}

function banner() {

  if (S.backOnline) return `<div class="banner ok"><span>Matterbridge restarted and your choices are live. If Matterbridge isn’t paired yet, now is the time to pair it with Apple Home, Google Home or Alexa.</span><button class="btn small link" data-act="dismiss">OK</button></div>`;

function facet(key, title, values, open) {
  const sel = S.filters[key];
  const counts = new Map();
  values.forEach((v) => counts.set(v, (counts.get(v) || 0) + 1));
  const opts = [...counts.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0])))
    .map(([v, c]) => `<label class="opt"><input type="checkbox" data-facet="${key}" value="${esc(v)}" ${sel.has(v) ? 'checked' : ''}>${esc(v)}<span class="c">${c}</span></label>`).join('');
  if (!opts) return '';
  return `<details ${open || sel.size ? 'open' : ''}><summary>${title}${sel.size ? `<span class="badge">${sel.size}</span>` : ''}</summary><div class="opts">${opts}</div></details>`;
}

function sidebar() {
  const domainRule = (key, title, hint) => `<div class="rule"><label for="add-${key}">${title}</label>
    <div class="chips">${S[key].map((d) => `<span class="dchip">${esc(d)}<button data-rmdomain="${key}" data-d="${esc(d)}" aria-label="Remove ${esc(d)}">×</button></span>`).join('') || `<span class="note">${hint}</span>`}</div>
    <select id="add-${key}" data-adddomain="${key}"><option value="">Add a domain…</option>${S.domains.filter((d) => !S.onlyDomains.includes(d) && !S.neverDomains.includes(d)).map((d) => `<option>${esc(d)}</option>`).join('')}</select></div>`;
  return `<aside class="side ${S.showFilters ? 'open' : ''}">
    <div class="side-head"><b>Filters</b>${activeFilterCount() ? `<button class="btn small link" data-act="clearFilters">Clear all</button>` : ''}</div>
    ${facet('status', 'Status', S.items.map((it, i) => GROUP[status(it, i)]), true)}
    ${facet('area', 'Areas', S.items.map((it) => it.area))}
    ${facet('label', 'Labels', S.items.flatMap((it) => it.labels))}
    ${facet('integration', 'Integrations', S.items.map((it) => it.integration))}
    ${facet('kind', 'Type', S.items.map((it) => (it.kind === 'device' ? 'Devices' : 'Single entities')))}
    <div class="rules">
      <h3>Domain rules</h3>
      <p class="note">These apply to everything, now and in the future.</p>
      ${domainRule('onlyDomains', 'Only include these domains', 'Empty means all domains.')}
      ${domainRule('neverDomains', 'Never include these domains', 'None yet.')}
    </div>
  </aside>`;
}

const activeFilterCount = () => Object.values(S.filters).reduce((n, s) => n + s.size, 0);

function visibleItems() {
  const q = S.search.trim().toLowerCase();
  const f = S.filters;
  const order = { adding: 0, removing: 0, changed: 0, notsynced: 1, synced: 2, na: 3 };
  return S.items.map((it, i) => [it, status(it, i)]).filter(([it, st]) => {
    if (f.status.size && !f.status.has(GROUP[st])) return false;
    if (f.area.size && !f.area.has(it.area)) return false;
    if (f.label.size && !it.labels.some((l) => f.label.has(l))) return false;
    if (f.integration.size && !f.integration.has(it.integration)) return false;
    if (f.kind.size && !f.kind.has(it.kind === 'device' ? 'Devices' : 'Single entities')) return false;
    if (q && ![it.name, it.area, it.integration, ...it.capabilities.map((c) => c.entityId)].some((s) => String(s).toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => order[a[1]] - order[b[1]]).map(([it]) => it);
}

function row(it) {
  const st = status(it);
  const [cls, label] = STATUS[st];
  const meta = `${esc(it.area)} · ${esc(it.integration)}${it.kind === 'entity' ? ' · single entity' : ''}`;
  if (st === 'na') {
    const why = it.notUseful && it.notUseful !== 'Nothing here works in Matter' ? `Not useful in Matter: ${it.notUseful.replace(/^./, (c) => c.toLowerCase())}` : it.notUseful ? it.notUseful : hasMatter(it) ? 'Hidden by domain rules' : 'Nothing here works in Matter';
    return `<div class="tr na" role="row"><div><input type="checkbox" class="sel" disabled aria-label="${esc(it.name)} is not supported"></div>
      <div class="nm"><span class="ico">${iconFor(it)}</span><div><div class="t">${esc(it.name)}</div><div class="m">${meta}</div></div></div>
      <div><span class="pill na">${label}</span></div><div class="note">${esc(why)}</div></div>`;
  }
  const caps = it.capabilities.filter((c) => c.matter);
  const open = S.expanded.has(it.id);
  const shown = open ? caps : caps.slice(0, 3);
  const capHtml = it.kind === 'entity'
    ? `<span class="cap dis" style="font-style:normal">${esc(caps[0].matter)}</span>`
    : shown.map((c) => {
      if (!domainAllowed(domainOf(c.entityId))) return `<span class="cap dis" title="${esc(c.entityId)}">${esc(c.name)} · domain rule</span>`;
      return `<label class="cap ${c.selected ? '' : 'off'}" title="${esc(c.entityId)} → ${esc(c.matter)}"><input type="checkbox" data-cap="${esc(it.id)}" data-e="${esc(c.entityId)}" ${c.selected ? 'checked' : ''}>${esc(c.name)}</label>`;
    }).join('') + (caps.length > 3 ? `<button class="more" data-expand="${esc(it.id)}">${open ? 'Show less' : `+${caps.length - 3} more`}</button>` : '');
  return `<div class="tr ${cls === 'pending' ? 'pending' : ''}" role="row">
    <div><input type="checkbox" class="sel" data-pick="${esc(it.id)}" title="${it.selected ? 'Untick to remove from Matter' : 'Tick to sync to Matter'}" aria-label="Sync ${esc(it.name)} to Matter" ${it.selected ? 'checked' : ''}></div>
    <div class="nm"><span class="ico">${iconFor(it)}</span><div><div class="t">${esc(it.name)}</div><div class="m">${meta}</div></div></div>
    <div><span class="pill ${cls}">${label}</span></div>
    <div class="caps">${capHtml}${it.notUseful ? `<div class="note" style="flex-basis:100%;color:var(--wait)">Not very useful in Matter: ${esc(it.notUseful.replace(/^./, (c) => c.toLowerCase()))}. Consider removing it.</div>` : ''}</div></div>`;
}

function renderSaveBar() {
  const show = (S.mode === 'devices' || (S.mode === 'wizard' && S.step === 4)) && S.tokenState === 'ok' && !!S.saved;
  $('#savebar').hidden = !show;
  const n = dirtyCount();
  $('#saveState').innerHTML = n ? `<b>${n} ${n === 1 ? 'change' : 'changes'} waiting to save</b>` : 'Everything is saved';
  $('#discard').disabled = !n || S.saving;
  $('#save').disabled = !n || S.saving;
}

// ---------- Save ----------
function confirmSave(title, bodyHtml) {
  return new Promise((resolve) => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle">${title}</h2>${bodyHtml}
      <div class="actions"><button class="btn" id="mStop">Cancel</button><button class="btn danger" id="mGo">Save anyway</button></div></div>`;
    m.hidden = false;
    $('#mStop').focus();
    const done = (value) => { m.hidden = true; m.innerHTML = ''; resolve(value); };
    $('#mStop').onclick = () => done(false);
    $('#mGo').onclick = () => done(true);
  });
}

async function save() {
  // Only devices that can reach Matter count: an unsupported row stays out of the saved list.
  const picked = S.items.filter((it) => it.selected && supported(it));
  const warnings = [];
  if (S.reset) warnings.push('<p><b>Start fresh</b> removes your old setup: the device and entity lists, the area and label filters and the split entities. Your Home Assistant address and key stay.</p>');
  if (picked.length === 0) warnings.push(`<p>Nothing is ticked. When no device is picked, the plugin sends <b>everything</b> it supports to Matter:</p><div class="big-n">${S.items.filter(supported).length}</div><p>devices and entities will be exposed to your Matter apps.</p>`);
  if (warnings.length && !(await confirmSave(picked.length === 0 ? 'Careful: nothing is ticked' : 'Save and start fresh?', warnings.join('')))) return;
  const body = {
    reset: S.reset,
    selected: picked.map((it) => it.id),
    unchecked: Object.fromEntries(S.items.filter((it) => it.kind === 'device').map((it) => [it.id, it.capabilities.filter((c) => !c.selected).map((c) => c.entityId)])),
    onlyDomains: S.onlyDomains, neverDomains: S.neverDomains,
  };
  S.saving = true; renderSaveBar();
  try {
    const r = await api('save', body);
    if (!r.ok) throw new Error(r.message ?? r.error ?? 'Save failed');
    S.savedNotice = true; S.backOnline = false; S.reset = false; toast('Saved');
    if (S.mode === 'wizard') S.mode = 'devices';
    await loadItems(false);
  } catch (error) {
    toast(`Couldn’t save: ${error.message}`);
  }
  S.saving = false; render();
}

// ---------- Events ----------
// Tick only the main functions (e.g. the switch of a plug); the extras stay unticked until the user adds them.
function selectMainFunctions(it) {
  const main = it.capabilities.some((c) => c.main && c.matter);
  it.capabilities.forEach((c) => (c.selected = main ? !!c.main : true));
}

function pick(it, on) {
  it.selected = on;
  if (on && !it.capabilities.some((c) => c.selected && c.matter)) selectMainFunctions(it);
}

function go(n) {
  S.step = n; S.maxStep = Math.max(S.maxStep, n);
  if (n === 4 && S.tokenState === 'ok' && !S.saved) loadItems(true);
  render(); window.scrollTo({ top: 0 });
}

document.addEventListener('click', (ev) => {
  const t = ev.target;
  const g = t.closest('[data-go]');
  if (g && !g.disabled) { if (S.mode !== 'wizard') { S.mode = 'wizard'; } go(+g.dataset.go); return; }
  const a = t.closest('[data-act]');
  if (a && !a.disabled) {
    if (a.dataset.act === 'opentab') { setTimeout(closeHostWindow, 300); return; }
    const act = a.dataset.act;
    if (act === 'next') go(S.step + 1);
    else if (act === 'back') go(S.step - 1);
    else if (act === 'skip') { S.skipped = true; go(4); }
    else if (act === 'check') checkToken();
    else if (act === 'rescan') { S.servers = null; render(); }
    else if (act === 'fresh') startFresh();
    else if (act === 'restart') restartMatterbridge();
    else if (act === 'dismiss') { S.backOnline = false; render(); }
    else if (act === 'reload') { S.mode = 'loading'; start(); }
    else if (act === 'cancel') { if (!closeHostWindow()) toast('Use the Close button of the Matterbridge window.'); }
    else if (act === 'refresh') loadItems(true);
    else if (act === 'fix') { S.mode = 'wizard'; S.tokenState = 'idle'; S.token = ''; S.saved = ''; S.server = S.status?.host || ''; S.servers = null; S.maxStep = 3; go(2); }
    else if (act === 'filters') { S.showFilters = !S.showFilters; render(); }
    else if (act === 'clearFilters') { Object.values(S.filters).forEach((s) => s.clear()); render(); }
    return;
  }
  const q = t.closest('[data-quick]');
  if (q) { S.filters.status.clear(); if (q.dataset.quick) S.filters.status.add(q.dataset.quick); render(); return; }
  const ex = t.closest('[data-expand]');
  if (ex) { const id = ex.dataset.expand; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); return; }
  const rm = t.closest('[data-rmdomain]');
  if (rm) { S[rm.dataset.rmdomain] = S[rm.dataset.rmdomain].filter((d) => d !== rm.dataset.d); render(); return; }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.name === 'srv') { S.server = t.value; render(); if (t.value === 'manual') $('#manual')?.focus(); return; }
  if (t.id === 'selAll') {
    const shown = visibleItems().filter(supported);
    shown.forEach((it) => pick(it, t.checked));
    toast(t.checked ? `${shown.length} will sync when you save` : `${shown.length} will be removed when you save`);
    render(); return;
  }
  if (t.dataset.pick) {
    const it = S.items.find((x) => x.id === t.dataset.pick);
    pick(it, t.checked);
    toast(it.selected ? `${it.name} will sync when you save` : `${it.name} will be removed when you save`);
    render(); return;
  }
  if (t.dataset.facet) { const s = S.filters[t.dataset.facet]; t.checked ? s.add(t.value) : s.delete(t.value); render(); return; }
  if (t.dataset.adddomain && t.value) { S[t.dataset.adddomain] = [...S[t.dataset.adddomain], t.value]; render(); return; }
  if (t.dataset.cap) {
    const it = S.items.find((x) => x.id === t.dataset.cap);
    it.capabilities.find((c) => c.entityId === t.dataset.e).selected = t.checked;
    if (!it.capabilities.some((c) => c.selected && c.matter)) { it.selected = false; toast(`No functions left, so ${it.name} won’t be synced`); }
    render();
  }
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'manual') { S.manual = t.value; const next = document.querySelector('[data-act="next"]'); if (next) next.disabled = !chosenUrl(); }
  if (t.id === 'token') { S.token = t.value; }
  if (t.id === 'search') { S.search = t.value; const pos = t.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('paste', (ev) => { if (ev.target.id === 'token') setTimeout(checkToken, 0); });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'token') checkToken();
  if (ev.key === 'Escape' && !$('#modal').hidden) $('#mStop')?.click();
});

// Mirror the expert config: reload when the page becomes visible again and nothing is waiting to save.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.mode === 'devices' && S.saved && !dirtyCount()) loadItems(false);
});

$('#discard').addEventListener('click', () => {
  const was = JSON.parse(S.saved);
  S.items.forEach((it, i) => { it.selected = was.i[i][0]; it.syncedAtLoad = was.i[i][0]; it.capabilities.forEach((c, j) => (c.selected = was.i[i][1][j])); });
  S.onlyDomains = [...was.o]; S.neverDomains = [...was.n]; S.reset = false;
  render(); toast('Changes discarded');
});
$('#save').addEventListener('click', save);

start();
</script>
</body>
</html>
